name: release

# Publishes proven-judge to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing: no token is stored in the repository.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version
        run: |
          version=$(python -c "import proven; print(proven.VERSION)")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Build
        run: |
          pip install build==1.3.0 twine==6.2.0
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
