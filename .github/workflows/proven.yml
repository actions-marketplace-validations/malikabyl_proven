name: proven

on:
  push:
  pull_request:

jobs:
  judge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Judge
        run: python proven.py check
      - name: Tests
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build==1.3.0 twine==6.2.0
          python -m build
          twine check dist/*
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          cd examples
          /tmp/try/bin/proven --version
          /tmp/try/bin/proven check good
          ! /tmp/try/bin/proven check bad
